<h4>1. DEFINITIONS</h4>
<p>In these Terms &amp; Conditions (unless otherwise required);</p>
<p>A) <strong>“Certification Scheme”</strong> means a third-party verification scheme that is open under transparent, fair and non-discriminatory terms to all organisations willing and able to comply with the scheme’s requirements, which certifies that a product complies with certain requirements, and for which the monitoring of compliance is objective, based on designated national or international Standard(s).</p>
<p>B) <strong>“The Company”</strong> means United Kingdom Testing &amp; Certification Limited (UKTC), and also (where the context so permits) its assigns and any sub-contractor for the said Company.</p>
<p>C) <strong>“Company’s Premises”</strong> means the premises mentioned in the Company quotation, agreement, or other contractual document in respect of the Services or if not so mentioned means the Company’s premises specified as such in the Contract.</p>
<p>D) <strong>“The Contract”</strong> means the Agreement, these Terms &amp; Conditions of Sale, the Company’s acknowledgement of the Customer’s order for Services and/or similar and such order and if there shall be any inconsistency between the documents comprising the Contract they shall have precedence in the order herein listed.</p>
<p>E) <strong>“The Customer”</strong> means the person, client, organisation, or company with whom the Contract is made by the Company whether directly or indirectly through an agent or factor who is acting for or instructed by or whose actions are ratified by such person, client, organisation, or company.</p>
<p>F) <strong>“Customer’s Premises”</strong> means the premises specified as such in the Contract.</p>
<p>G) <strong>“Parties”</strong> the parties to the Contract and “Party” means either of them.</p>
<p>H) <strong>“Service(s)”</strong> means the supply of testing, product certification and/or other activities (if any) to be provided to the Customer by the Company pursuant to the Contract.</p>
<p>I) <strong>“Specimen”</strong> means the products, articles, or items or components thereof and associated items (or any) of them described in the Contract for testing, product certification and/or other Service.</p>
<p>J) <strong>“Standard”</strong> means a document which contains details of specified requirements and methodologies for testing and /or inspection and/or certification against which the System, product, installation, or person is assessed.</p>
<p>K) <strong>“System”</strong> means the organisational structure, responsibilities, activities, resources, and events that together provide organised procedures and methods of implementation to ensure the capability of the Customer to meet a particular designated Standard.</p>
<p>L) The <strong>“Terms and Conditions”</strong> of Sale, where appropriate, means the Terms and Conditions of Sale applicable to Customers seeking Testing, Product Certification and/or other Services as published by the Company.</p>
<p>M) Words in the singular shall include the plural and vice versa.</p>
<p>N) Reference to any gender shall include the others.</p>
<p>O) References to legal persons shall include natural persons and vice versa.</p>
<h4>2. FORMATION OF CONTRACT</h4>
<p><strong>2.1</strong> These terms and conditions <strong>(“Terms and Conditions”)</strong> together with any <strong>(“Agreement”)</strong>, quotation, proposal, estimate or fee quote <strong>(“Quotation”)</strong> provided by or on behalf of the Company (as defined above) shall apply to all contracts for the supply of testing, product certification and/or other services <strong>(“Services”)</strong> carried out by <strong>United Kingdom Testing &amp; Certification Limited</strong> (a company registered in Scotland with registered number SC654601) providing the services contemplated therein on behalf of a customer <strong>(“Customer”).</strong></p>
<p><strong>2.2</strong> These Terms &amp; Conditions shall be deemed to be incorporated in the Contract and in the case of any inconsistency with any order, letter of form of contract sent by the Customer to the Company or any other communication between the Customer and the Company whatever may be their respective dates, the provision of these Terms &amp; Conditions shall prevail unless expressly varied in writing and signed by a Director authorised signatory of the Company. Any concession made or latitude allowed by the Company to the Customer shall not affect the strict rights of the Company under the Contract. If in any particular case any of these Terms &amp; Conditions shall be held to be invalid or shall not apply to the Contract the other Terms &amp; Conditions shall continue in full force and effect. Any phrase introduced by the terms <strong>“including,” “include”, “in particular”</strong> or any similar expression, shall be construed as illustrative and shall not limit the sense of the words preceding those terms.</p>
<p><strong>2.3</strong> All Quotations will be in writing, and unless previously withdrawn, the Company’s quotation and tenders shall remain valid for the period stated therein or if no period is stated for thirty (30) days from their date thereof. The Company may withdraw any such Quotation at any time. No Quotation given by the Company shall be an offer to contract with any person and no contract shall come into existence except in accordance with clause 2.4. Costs are based upon the limited information provided by the Customer at the time of Quotation.</p>
<p><strong>2.4</strong> The Customer’s purchase order must be in writing and must be accompanied by sufficient information to enable the Company to execute the order to assist in achieving an efficient Service. This will include a purchase order number, reference, or authorisation, about each Specimen and/or Service. The Customer’s purchase order or the Customer’s acceptance of a Quotation constitutes an offer by the Customer to purchase the Services specified in the Quotation upon these Terms and Conditions. Notwithstanding that the Company may have given a detailed Quotation, no order shall be binding on the Company unless it has been accepted in writing by the Company, or (if earlier) by the Company starting to provide the Services, when a contract for the supply and purchase of those Services on these Terms and Conditions will be established (the <strong>“Contract”</strong>).</p>
<p><strong>2.5</strong> It is the Customer’s responsibility to check that the Company’s written acceptance of the order is correct. Any discrepancy between the Customer’s order and the Company’s acceptance must be notified to the Company in writing within seven (7) days of the date of such acceptance. In the absence of such notification the Company shall be entitled to supply services in accordance with the acceptance, and the Customer shall be obliged to pay the agreed contract price therefore.</p>
<p><strong>2.6</strong> No acceptance or acknowledgement, even if in writing and signed by the Company, of the Customer’s purchase order or any other document pertaining to the Services shall constitute acceptance of any provision of the Customer’s purchase order or any other document that conflicts with or adds to these Terms and Conditions unless the Company specifically agrees to such a variation of these Terms and Conditions pursuant to and in accordance with clause(s) 3.0 and 4.0.</p>
<p><strong>2.7</strong> The delivery to the Company of any item for testing by the Company (a <strong>“Specimen”</strong>) or the delivery of any request by the Customer to the Company for the provision of any similar services shall, upon acceptance of that Specimen or request by the Company, constitute an “offer” (as referred to in clause 2.4). If the Company begins such testing deemed to have been accepted by the Company and a Contract shall be formed. These Terms and Conditions shall apply to that Contract.</p>
<p><strong>2.8</strong> The Company’s obligations to supply Services depends on (Customer obligations):</p>
<p><strong>2.8.1</strong> That the Customer has provided the documents, approvals and releases required and has given full details of relevant specifications;</p>
<p><strong>2.8.2</strong> That an agreement has been reached on all details relating to the order;</p>
<p><strong>2.8.3</strong> That all order amendments requested by the Customer have been formally confirmed by the Company in writing;</p>
<p><strong>2.8.4</strong> That the Company has received any contractually agreed advance payment.</p>
<p><strong>2.9</strong> Nothing contained in the foregoing paragraph shall affect the Company’s rights accruing from the Customer’s failure to fulfil, or delay in fulfilling these primary duties.</p>
<h4>3. AMENDMENTS, MODIFICATIONS &amp; ADDITIONS</h4>
<p><strong>3.1</strong> These Terms and Conditions may not be varied or waived by either party unless the variation or waiver is in writing and is signed by a duly authorised signatory of the Company. The variation or waiver must set out the condition(s) or sub-condition(s) to be varied or waived and the detail of each such variation or waiver.</p>
<p><strong>3.2</strong> The Company reserves the right to refuse to make any amendments or modifications to an order or contract once it has been accepted. If, in its absolute discretion, the Company agrees to the Customer’s request for amendments or modifications after acceptance, the Company may impose additional charges to be notified in writing to the Customer.</p>
<p><strong>3.3</strong> Although additions by the Customer to an order are welcomed, they will be treated as a new order, and should not be regarded by the Customer as necessarily being on the same Terms and Conditions as the main order or contract, unless expressly stated to be so by the Company in writing.</p>
<h4>4. ADDITIONAL COSTS</h4>
<p><strong>4.1</strong> The Company reserves the right to review and amend any Quotation prices where documentation, specification or other materials relating to the Contract have materially changed since the original Quotation was given or where additional services not envisaged by the Quotation are requested, for example, producing written descriptions of detailed procedures undertaken as part of the Services. For avoidance of all doubt, approval of such additional requests shall remain at the Company’s discretion.</p>
<p><strong>4.2</strong> The Company reserves the right to make an additional charge for any extras ordered by the Customer and not specified in the quotation and also for the expense of all inspections, tests alterations or additions or any other work undertaken at the Customer's request. In particular but without prejudice to the generality of the foregoing, the Company may impose a charge for inspecting and/or testing Specimens, Goods and/or Services alleged by the Customer to be defective, or not in compliance with their contractual description, if the Company determines that the Specimens, Goods and/or Services are not defective and/or do comply with their contractual description and/or any defects are not the responsibility of the Company under the terms of the Contract.</p>
<p><strong>4.3</strong> The Customer agrees to pay for any loss or extra cost incurred by the Company through the Customer’s instruction or lack of instruction or through failure or delay or through any act or default on the part of the Customer, its servants, agents or employees.</p>
<p><strong>4.4</strong> Where the quoted price does not include carriage the Company shall determine the route and method of carriage and any special requirements of the Customer, which shall be subject to an additional charge.</p>
<p><strong>4.5</strong> The Company may charge the Customer an extra sum for any site visits and abortive or excessive numbers of tenders prepared. Any packaging that may be provided is for delivery purposes only where this is included in the Contract. It is the Customer’s responsibility to dispose of all packaging after delivery.</p>
<p><strong>4.6</strong> The Company’s quotations, estimates and tenders are invitations to the Customer to make an offer to enter into contract with the Company on the terms set out herein.</p>
<p><strong>4.7</strong> All prices are exclusive of Value Added Tax and this will be charged at the appropriate tax rate.</p>
<h4>5. POSTPONEMENT &amp; CANCELLATION</h4>
<p><strong>5.1</strong> The Customer may postpone or cancel any order or Contract (in whole or in part) at any time. Should the Customer wish to postpone or cancel all or part of the order or Contract from the start date that was mutually agreed following acceptance by the Customer of the Quotation, and without prejudice to the Company’s other rights and remedies hereby reserved, the Company shall charge and be entitled to recover either all or part of the fee agreed as appropriate. This will include, in addition, the cost of any work performed up to the receipt by the Company of the notice of the cancellation, calculated in accordance with the applicable day rate for a relevant employee.</p>
<p><strong>5.2</strong> Save as provided in clause(s) twenty (20) and twenty two (22) hereof Contracts or orders shall not be postponed or cancelled except by agreement in writing of both parties and upon the payments to the Company of such amount:</p>

<h4>6. PRICING</h4>
<p><strong>6.1</strong> Pricing is quoted (and amended occasionally) for the Services and/or Goods agreed to be supplied in the Company’s final quotation made in writing to the Customer and/or pursuant to the Contract (Agreement) on the assumption that the information supplied by the Customer is accurate and complete.</p>
<p><strong>6.2</strong> Any Goods and/or Service required or supplier in addition to the Goods/Services will be charged at the Company’s rates current at the time of supply.</p>
<p><strong>6.3</strong> The Company reserves the right to adjust the invoice by the amount of any increase of additional costs after the prices are quoted, and the invoice shall be so adjusted payable as if it were the original contract price if:</p>
<p><strong>6.3.1</strong> implementing any request by the Customer, for changes in, schedules, completion dates, quantities, design, and specifications.</p>
<p><strong>6.3.2</strong> there are delays caused by the instruction of the Customer and/or by failure of the Customer to give adequate instructions or information to the Company.</p>
<p><strong>6.3.3</strong> costs are increased resulting from the prohibition or other actions of any government.</p>
<p><strong>6.4</strong> Expenses and disbursements may be charged separately in accordance with the quoted terms.</p>
<p><strong>6.5</strong> All fees and expenses quoted are exclusive of all taxes including, but not limited to, value added or sales tax, which will be charged at the current rate of the country in which the services are supplied.</p>
<p><strong>6.6</strong> The price quoted as payable for the Services is based upon the Services being carried out during the Company’s normal working hours (which are 8.00am to 17.00pm Monday to Friday), not overtime. If overtime is required, this will be worked at a rate to be notified.</p>
<h4>7. TERMS OF PAYMENT</h4>
<p><strong>7.1</strong> Unless otherwise agreed by the Company in writing, and subject always to the credit provision of clause 8 hereof, payment for Services and/or Goods shall be due thirty (30) days from date of service provision or as agreed in the Quotation. Payment shall be made in full, without set off or deduction.</p>
<p><strong>7.2</strong> If the Services and/or Goods are provided or delivered in instalments on discrete occasions, the Company shall be entitled to invoice each instalment as and when provision of Service or delivery thereof has been made or performance thereof has been affected. Payment shall be due in respect of each instalment whereof Service has been provided made or whereof performance has been affected notwithstanding non-delivery of other instalments or other default on the Company’s part.</p>
<p><strong>7.3</strong> If upon the Terms applicable to any order the price shall be payable by instalments or if the Customer has agreed to take specified Services or quantities of Goods at specified times a default by the Customer of the payment of any due instalment or the failure to give delivery instructions in respect of any quantity of Goods outstanding shall cause the whole of the balance of the price to become due forthwith and the Company shall be entitled to suspend work and further Services and/or deliveries in respect of such order until payment has been made.</p>
<p><strong>7.4</strong> The price of Services and/or Goods shall be due in full to the Company in accordance with the Terms of the Contract and the Customer shall not be entitled to exercise any set off lien or any other similar right or claim.</p>
<p><strong>7.5</strong> The time of payment shall be in the essence of the Contract.</p>
<p><strong>7.6</strong> In default of payment within the thirty (30) days from date of service provision or as agreed in the Quotation, the Company may suspend any further services carried out for the Customer; withhold the provision of Reports and/or suspend the provision of all Services and/or terminate the Contract (including suspension or withdrawal of Certification), (as defined in clause 9.0), alter or withdraw credit terms; and amend terms, prices, or service levels. The condition is without prejudice to the Company’s right to deem the contract repudiated by any fundamental breach of contract by the Customer (which expression shall include any failure to make payment within the payment terms agreed).</p>
<p><strong>7.7</strong> If not paid within the period, then without prejudice to any other right of the Company, reserves the right to charge interest (at the statutory rate on commercial debts then applicable) from the due date until payment in full.</p>
<p><strong>7.8</strong> Furthermore, without prejudice to the above the Company shall be entitled to recover from the Customer all reasonable legal, administrative, and other costs and expenses incurred in recovering overdue payments of the price of the Goods and/or Services.</p>
<p><strong>7.9</strong> The Customer undertakes that during the provision of Services and for six (6) months following completion thereof, the Customer shall not:</p>
<p><strong>7.9.1</strong> solicit or entice away (or assist anyone else in soliciting or enticing away) any member of the Company’s staff with whom the Customer has had dealings in connection with the Contract and/or provision of the Services during the twelve (12) months immediately prior to the earlier of the date of the Customer’s purchase order on the date of the Quotation; or</p>
<p><strong>7.9.2</strong> employ (directly or through a third party) any person as referred to in clause 7.9.1 or engage them in any way to provide services to the Customer.</p>
<p><strong>7.10</strong> This undertaking shall not apply in respect of any member of the Company’s staff who without having been previously approached directly or indirectly by the Customer responds to an advertisement placed by the Customer or on the Customer’s behalf.</p>
<p><strong>7.11</strong> In the event of a breach of this undertaking, which leads to the departure of any person as referred to in clause 7.9.1, the Customer will pay to the Company, on demand, a sum equivalent to fifty per cent (50%) of the total remuneration package paid by the Company to the individual prior to their departure. The Customer acknowledges that this provision is a fair and reasonable term intended to be a genuine assessment of the likely loss to the Company.</p>
<h4>8. CREDIT TERMS</h4>
<p><strong>8.1</strong> The provision of a credit facility is a matter for the unfettered discretion of the Company, as is the amount of credit extended. Should a credit facility be offered, it is on the condition that it may be reduced or cancelled without prior notice. On withdrawal of a credit facility, all amounts owing there under shall become immediately payable to the Company.</p>
<p><strong>8.2</strong> Credit Terms, where granted, shall apply only so long as the amount outstanding on this or any other contract between the Company and the Customer does not exceed the Customer’s credit limit. Should the credit limit be exceeded, or if it would be exceeded by further services, payment before further services will be required.</p>
<p><strong>8.3</strong> Credit facilities will not be approved for orders of a price less than £5,000 (excluding VAT) except where a current trading account exists. Without prejudice to the Company’s rights to refuse or withdraw any credit facility or alter the amount of credit extended without notice, credit shall be extended for thirty (30) days from date of service provision and the time within which the Customer is to pay for the Service shall be of the essence of the Contract.</p>
<p><strong>8.4</strong> If credit repayment is overdue on this or any other Contract between the Company and the Customer, then the Company may refuse to supply any further services and/or goods to the Customer under any Contract that it may have with the Customer, without liability to the Company. The Customer shall be liable for any loss, damage or expense arising out of any withdrawal or reduction of credit or refusal to supply further services and/or goods in accordance with this clause, including any loss damage or expense suffered by the Company thereby.</p>
<h4>9. SERVICES</h4>
<p><strong>9.1</strong> Subject to the remaining clauses of this clause 9.0, the Company warrants that it will complete the Services in a satisfactory and efficient manner, consistent with industry standards. The Customer expressly acknowledges and agrees that the Company gives no warranty that any result or objective can be achieved through the Services and that, where results are based on smaller scale tests and theoretical studies, results may require careful validation in order to be extrapolated to a production scale.</p>
<p><strong>9.2</strong> The Company will use its reasonable endeavours to complete Services and provide written information, results, technical reports, test or inspection records, drawings, recommendations, advice or similar in respect of the Services <strong>(“the Report”)</strong> thereon to the Customer by any date reasonably requested in writing by the Customer, but the Company shall not be liable to the Customer for:</p>
<p>(i) any delay in the performance of any obligation under the Contract; or</p>
<p>(ii) damages suffered by the Customer by reason of such delay.</p>
<p><strong>9.3</strong> Where laboratory Services are provided, the Company may refuse to perform or terminate a test prematurely if it has reasonable cause to do so. Reasons may include but are not limited to extreme levels of heat which may damage testing equipment.</p>
<p><strong>9.4</strong> The Company’s obligation to complete Services under the Contract shall be subject to any obligation it may have to comply with any law or other regulation binding on it which may be in force from time to time.</p>
<p><strong>9.5</strong> No employee, agent or other person is authorised to give any warranty or make any representation on behalf of the Company in relation to the Contract, or to assume for the Company any other liability in connection with the Services, unless such warranty, representation or assumption of liability is given to the Customer in accordance with clause 3.1.</p>
<p><strong>9.6</strong> The Customer represents and warrants to the Company the completeness and accuracy of all documents and information supplied to the Company for the purposes of the Company fulfilling the Services, both at the time of supply and subsequently.</p>
<p><strong>9.7</strong> Reports are issued on the basis of information known to the Company at the time the Services are carried out. Although the Company will use all reasonable endeavours to ensure accuracy, the Services depend, inter alia, on the effective co-operation of the Customer, its employees and on the information submitted to the Company. All Reports are prepared on the basis that:</p>
<p><strong>9.7.1</strong> there is no responsibility to any person or body other than the Customer;</p>
<p><strong>9.7.2</strong> they are not produced for any particular purpose and no statement is to be deemed, in any circumstances to be or give rise to a representation, undertaking, warranty or contractual condition unless specifically stated;</p>
<p><strong>9.7.3</strong> the Report is determined solely by the professional analysis undertaken by the Company’s employees on each individual Contract and any forecasts by the Company of the results is an estimate only;</p>
<p><strong>9.7.4</strong> it is the customers responsibility to inform the laboratory during review of the contract if a statement of conformity is required, as statements of conformity shall not be made or implied as part of the test report.</p>
<p><strong>9.7.5</strong> the Company is entitled to be paid for the provision of Services irrespective of the results or conclusions reached in the Report;</p>
<p><strong>9.7.6</strong> the results of the Services shall address the items and information submitted only and are not to be regarded as representative of any larger population from which the Specimen was taken; and</p>
<p><strong>9.7.7</strong> the results are final and approved by the Company. The Company shall be under no liability where the Customer has acted on preliminary, unapproved results or advice.</p>
<h4>10. USE OF REPORTS</h4>
<p><strong>10.1</strong> The Reports constitute confidential information that is to be protected and shall be solely used to:</p>

    if(!document.getElementById("f-ok").checked){err.textContent="Tick the box to accept the terms.";return}
    const c2=calc();
    accepted={name:v("f-name"),position:v("f-pos"),email:v("f-email"),po:v("f-po"),at:new Date()};
    fingerprint=await sha(JSON.stringify({q:Q,extras:[...picked],accepted:{...accepted,at:accepted.at.toISOString()},total:c2.total.toFixed(2)}));
    render(); window.scrollTo(0,0);
  };
}
function keepForm(fn){const ids=["f-name","f-pos","f-email","f-po"];const vals={};ids.forEach(i=>{const e=document.getElementById(i);if(e)vals[i]=e.value});const ok=document.getElementById("f-ok")?.checked;fn();ids.forEach(i=>{const e=document.getElementById(i);if(e&&vals[i])e.value=vals[i]});const o=document.getElementById("f-ok");if(o&&ok)o.checked=true;}

Q=parse();
if(!Q){document.getElementById("root").innerHTML=`<div class="err"><img src="${LOGO}" style="height:18mm" alt="UKTC"><h2>Quotation link incomplete</h2><p>This page shows UKTC quotations from a link generated in HubSpot. The link you opened doesn't contain a quotation. Please contact <a href="mailto:info@uktestcert.com">info@uktestcert.com</a>.</p></div>`;}
else render();
window.addEventListener("hashchange",()=>{Q=parse();picked=new Set();accepted=null;if(Q)render()});
</script>
</body>
